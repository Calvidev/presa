[build-system]
requires      = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name            = "str-agent"
version         = "0.1.0"
description     = "AirDNA-like short-term rental data scraper"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.44",
    "curl-cffi>=0.7",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.scripts]
str-agent = "str_agent.cli:cli"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
